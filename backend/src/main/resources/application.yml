spring:
  application:
    name: JobAssistant

  # Data source configuration.
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/jobassistant
    username: postgres
    # 从环境变量读取数据库密码
    password: ${DATABASE_PASSWORD}

  # JPA configuration.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway configuration.
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  issuer: job-assistant #JWT 的签发者
  # Access Token 有效时间：900 秒，也就是 15 分钟。
  expiration-seconds: 900
  # Refresh Token 有效时间：2592000 秒，也就是 30 天。
  refresh-expiration-seconds: 2592000

  # 同一个旧 Refresh Token 的并发容错时间：5 秒。
  # 在此时间内重复提交旧 Token，会返回同一次刷新结果。
  refresh-concurrency-grace-seconds: 5
  # 从环境变量读取 JWT 签名密钥
  secret: ${JWT_SECRET}
app:
  cors:
    allowed-origin: http://localhost:5173
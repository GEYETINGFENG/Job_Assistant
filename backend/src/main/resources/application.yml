spring:
  application:
    name: JobAssistant

  # Data source configuration.
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/jobassistant
    username: postgres
    # 从环境变量读取数据库密码
    password: ${DATABASE_PASSWORD}

  # JPA configuration.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway configuration.
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 单个上传文件最大 10 MB。
      max-file-size: 10MB
      # 整个 multipart 请求最大 12 MB。
      max-request-size: 12MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  issuer: job-assistant #JWT 的签发者
  # Access Token 有效时间：900 秒，也就是 15 分钟。
  expiration-seconds: 900
  # Refresh Token 有效时间：2592000 秒，也就是 30 天。
  refresh-expiration-seconds: 2592000

  # 同一个旧 Refresh Token 的并发容错时间：5 秒。
  # 在此时间内重复提交旧 Token，会返回同一次刷新结果。
  refresh-concurrency-grace-seconds: 5
  # 从环境变量读取 JWT 签名密钥
  secret: ${JWT_SECRET}
app:
  cors:
    allowed-origin: http://localhost:5173
  resume:
    # PDF 文件保存目录。
    storage-directory: ./data/resumes
    security:
      # Tika 最多允许提取 100000 个字符。
      max-extracted-characters: 100000
      zip:
        # DOCX ZIP 内最多允许 2000 个 Entry。
        max-entries: 2000
        # 单个 Entry 最大解压大小：20 MB。
        max-single-entry-bytes: 20971520
        # 整个 DOCX 最大解压大小：50 MB。
        max-total-uncompressed-bytes: 52428800
        # 最大允许压缩比：100 倍。
        max-compression-ratio: 100
        # 解压超过 1 MB 后再检查压缩比。
        compression-ratio-check-threshold: 1048576
    ai:
      # false：只提取 PDF 文本，方便本地开发
      # true：调用阿里云百炼进行结构化解析
      enabled: ${RESUME_AI_ENABLED:false}
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${BAILIAN_MODEL:qwen3.7-flash-2026-07-15}
      enable-thinking: false
      max-text-characters: 30000
      max-output-tokens: 4000
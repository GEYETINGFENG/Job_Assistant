spring:
  application:
    name: JobAssistant
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s

  # Data source configuration.
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/jobassistant
    username: postgres
    # 从环境变量读取数据库密码
    password: ${DATABASE_PASSWORD}

  # JPA configuration.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway configuration.
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 单个上传文件最大 10 MB。
      max-file-size: 10MB
      # 整个 multipart 请求最大 12 MB。
      max-request-size: 12MB
  task:
    scheduling:
      pool:
        # worker 和恢复任务使用不同调度线程，避免慢解析阻塞故障恢复。
        size: 2
      thread-name-prefix: resume-scheduler-

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  issuer: job-assistant #JWT 的签发者
  # Access Token 有效时间：900 秒，也就是 15 分钟。
  expiration-seconds: 900
  # Refresh Token 有效时间：2592000 秒，也就是 30 天。
  refresh-expiration-seconds: 2592000

  # 同一个旧 Refresh Token 的并发容错时间：5 秒。
  # 在此时间内重复提交旧 Token，会返回同一次刷新结果。
  refresh-concurrency-grace-seconds: 5
  # 从环境变量读取 JWT 签名密钥
  secret: ${JWT_SECRET}
app:
  cors:
    allowed-origin: http://localhost:5173
  resume:
    # PDF 文件保存目录。
    storage-directory: ./data/resumes
    security:
      # Tika 最多允许提取 100000 个字符。
      max-extracted-characters: 100000
      zip:
        # DOCX ZIP 内最多允许 2000 个 Entry。
        max-entries: 2000
        # 单个 Entry 最大解压大小：20 MB。
        max-single-entry-bytes: 20971520
        # 整个 DOCX 最大解压大小：50 MB。
        max-total-uncompressed-bytes: 52428800
        # 最大允许压缩比：100 倍。
        max-compression-ratio: 100
        # 解压超过 1 MB 后再检查压缩比。
        compression-ratio-check-threshold: 1048576
    ai:
      # false：只提取 PDF 文本，方便本地开发
      # true：调用阿里云百炼进行结构化解析
      enabled: ${RESUME_AI_ENABLED:false}
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${BAILIAN_MODEL:qwen3.7-flash-2026-07-15}
      # 提示词、输出结构或影响解析结果的配置变化时，必须升级此版本。
      prompt-version: ${RESUME_AI_PROMPT_VERSION:v1}
      cache-ttl: ${RESUME_AI_CACHE_TTL:24h}
      rate-limit:
        # 所有实例必须使用相同 Redis 数据库和限流参数，一个令牌对应一次模型请求。
        capacity: ${LLM_RATE_LIMIT_CAPACITY:3}
        refill-per-second: ${LLM_RATE_LIMIT_REFILL_PER_SECOND:0.1}
      enable-thinking: false
      max-text-characters: 30000
      max-output-tokens: 4000
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION}
      presign-duration-minutes: 15 #手动测试先写15分钟
      staging-prefix: resume-uploads
      # 客户端只持有 staging 的预签名 URL，不能直接写入该处理目录。
      processing-prefix: resume-processing
      final-prefix: resumes
      freeze-recovery:
        # 避免与仍在执行条件复制的请求竞争。
        minimum-age-seconds: 30
        # 每轮扫描结束 30 秒后再次检查。
        fixed-delay-ms: 30000
        # 限制单轮恢复数量，避免异常积压时产生突发压力。
        batch-size: 100
    worker:
      # 每轮处理结束 1 秒后继续检查数据库队列。
      fixed-delay-ms: 1000
      # 单轮最多领取 3 个任务，避免一个实例长时间占满调度线程。
      batch-size: 3
      # 包含首次处理在内最多尝试 3 次，超过后进入 DEAD。
      max-attempts: 3
      # 第一次失败等待 30 秒，之后按指数退避增加等待时间。
      retry-base-delay-seconds: 30
      # 重试等待最多 10 分钟，避免故障期间请求过于频繁。
      retry-max-delay-seconds: 600
      # PROCESSING 超过 15 分钟视为 worker 中断，由协调任务重新入队。
      processing-timeout-seconds: 900
